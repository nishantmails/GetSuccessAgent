# Master data overrides for runtime configuration (editable by admins)
# Use this file to set bell-curve band percentages without editing code.

bell_curve:
  bands:
    - band: "Exceeds Expectations"
      rating: 1
      top_pct: 5
    - band: "Meets Expectations"
      rating: 2
      top_pct: 55
    - band: "Needs Development"
      rating: 3
      top_pct: 70
    - band: "Unsatisfactory Performance"
      rating: 4
      top_pct: 85
    - band: "Severe Compliance/Performance Issue"
      rating: 5
      top_pct: 100
